name: Auto PR

on:
  push:
    branches:
      - '**'
      - '!main'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-pr:
    name: Create Pull Request
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for existing PR or create new PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "Evaluating branch '${BRANCH}' for repository '${REPO}'..."

          # 1. Fetch origin main to determine commits ahead
          git fetch origin main --depth=100 || true
          AHEAD_COUNT=$(git rev-list --count origin/main..HEAD 2>/dev/null || echo 0)

          if [ "${AHEAD_COUNT}" -eq 0 ]; then
            echo "Branch '${BRANCH}' has 0 commits ahead of main. Skipping pull request creation."
            exit 0
          fi

          echo "Branch has ${AHEAD_COUNT} commit(s) ahead of origin/main."

          # 2. Check if an open PR already exists for this branch targeting main
          EXISTING_URL=$(gh pr list \
            --repo "${REPO}" \
            --head "${BRANCH}" \
            --base main \
            --state open \
            --json url \
            --jq '.[0].url' 2>/dev/null || true)

          if [ -n "${EXISTING_URL}" ] && [[ "${EXISTING_URL}" =~ ^https:// ]]; then
            echo "An open pull request already exists for branch '${BRANCH}': ${EXISTING_URL}"
            echo "Skipping creation to prevent duplicate pull requests."
            exit 0
          fi

          # 3. Generate PR title and structured description from actual commits
          LATEST_SUBJECT=$(git log -1 --format="%s")
          PR_TITLE="${LATEST_SUBJECT}"

          # Construct PR description safely into file
          {
            echo "## Pull Request Summary"
            echo ""
            echo "Automatically generated pull request from branch \`${BRANCH}\` into \`main\`."
            echo ""
            echo "### Included Commits (${AHEAD_COUNT})"
            git log origin/main..HEAD --format="- %h: %s"
            echo ""
            echo "### Automated Quality Checks"
            echo "The following CI status checks will run automatically on this pull request:"
            echo "- **Frontend / Typecheck**: TypeScript compiler check (\`tsc --noEmit\`)"
            echo "- **Frontend / Lint**: ESLint code quality & style checks"
            echo "- **Frontend / Test**: Vitest unit & integration test suites"
            echo "- **Frontend / Build**: Vite production client bundle compilation"
            echo "- **Backend checks**: Python syntax and unit tests"
            echo ""
            echo "### Merge Safeguards"
            echo "- Direct push to \`main\` is prohibited."
            echo "- This pull request requires code review approval and passing CI checks before merging."
            echo "- Auto-merge will only execute once all required reviews and status checks pass, subject to repository branch protection settings."
          } > pr_body.md

          echo "Attempting to create pull request via GitHub CLI..."
          set +e
          CREATE_OUTPUT=$(gh pr create \
            --repo "${REPO}" \
            --base main \
            --head "${BRANCH}" \
            --title "${PR_TITLE}" \
            --body-file pr_body.md 2>&1)
          CREATE_EXIT_CODE=$?
          set -e

          if [ ${CREATE_EXIT_CODE} -eq 0 ]; then
            PR_URL=$(echo "${CREATE_OUTPUT}" | grep -E '^https://' | head -n 1 || echo "${CREATE_OUTPUT}")
            echo "Successfully created pull request: ${PR_URL}"

            # 4. Attempt to configure auto-merge if repository settings permit it
            echo "Checking auto-merge capability..."
            if gh pr merge "${PR_URL}" --auto --squash 2>/dev/null; then
              echo "Auto-merge enabled for ${PR_URL} (will merge automatically once required reviews and checks pass)."
            else
              echo "Auto-merge is not enabled in repository settings or requires manual configuration. PR remains open for review."
            fi
            exit 0
          fi

          echo "gh pr create output: ${CREATE_OUTPUT}"

          # Handle known scenarios gracefully
          if echo "${CREATE_OUTPUT}" | grep -iq "already exists"; then
            echo "Pull request already exists for '${BRANCH}'."
            exit 0
          fi

          if echo "${CREATE_OUTPUT}" | grep -iq "Resource not accessible" || echo "${CREATE_OUTPUT}" | grep -iq "not permitted to create"; then
            echo "::warning::GitHub Actions GITHUB_TOKEN does not have write permission to create pull requests."
            echo "::notice title=Workflow Permissions::To allow automated PR creation, enable 'Allow GitHub Actions to create and approve pull requests' in repository Settings -> Actions -> General -> Workflow permissions."
            echo "Branch '${BRANCH}' is pushed and verified. You can create the PR with one click at: https://github.com/${REPO}/compare/main...${BRANCH}?expand=1"
            exit 0
          fi

          echo "::error::Pull request creation failed: ${CREATE_OUTPUT}"
          exit ${CREATE_EXIT_CODE}
